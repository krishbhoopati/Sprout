# Render deployment for Sprout (IMPLEMENTATION.md §20).
# Two services only: a static frontend and a FastAPI web service.
# Secrets (SUPABASE_SECRET_KEY, WORLD_LABS_API_KEY, N8N_WEBHOOK_SECRET) are set
# in the Render dashboard, not committed here.
services:
  - type: web
    name: sprout-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: MOCK_WEATHER
        value: "true"
      - key: MOCK_WORLD_LABS
        value: "true"
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com
      - key: WORLD_LABS_BASE_URL
        value: https://api.worldlabs.ai
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: WORLD_LABS_API_KEY
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false

  - type: web
    name: sprout-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
