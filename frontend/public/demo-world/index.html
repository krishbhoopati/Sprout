<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprout — 3D garden preview</title>
    <style>
      :root { --ink: #0f2417; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        /* Baseline gradient so the frame never looks broken, even before WebGL boots. */
        background: linear-gradient(180deg, #bfe6ff 0%, #d9f2e4 55%, #b7e0a4 100%);
        color: var(--ink);
      }
      #stage { position: fixed; inset: 0; display: block; }
      .overlay { position: fixed; pointer-events: none; z-index: 2; }
      .badge {
        top: 14px;
        left: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(6px);
        box-shadow: 0 6px 20px rgba(15, 36, 23, 0.15);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.2px;
      }
      .badge .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3f9d5a;
        box-shadow: 0 0 0 3px rgba(63, 157, 90, 0.25);
      }
      .hint {
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(15, 36, 23, 0.55);
        color: #eafff0;
        font-size: 12px;
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .hint.show { opacity: 1; }
      .legend {
        top: 14px;
        right: 14px;
        max-width: 42vw;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(6px);
        box-shadow: 0 6px 20px rgba(15, 36, 23, 0.15);
        font-size: 12px;
        line-height: 1.7;
      }
      .legend .row { display: flex; align-items: center; gap: 8px; }
      .legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
      .fallback {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .fallback h1 { margin: 0 0 6px; font-size: 20px; }
      .fallback p { margin: 0; max-width: 420px; opacity: 0.75; font-size: 14px; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div class="overlay badge"><span class="dot"></span> <span id="badge-text">Sprout · demo garden</span></div>
    <div class="overlay legend" id="legend"></div>
    <div class="overlay hint" id="hint">Drag to look around · scroll to zoom</div>

    <div class="fallback" id="fallback">
      <h1>Sprout garden preview</h1>
      <p>
        Your explorable 3D garden. Interactive rendering is unavailable in this
        view, but your plan is ready on the plan page.
      </p>
    </div>

    <script src="./three.min.js"></script>
    <script>
      (function () {
        if (typeof THREE === "undefined") {
          document.getElementById("fallback").style.display = "flex";
          return;
        }

        // ---- Read the garden from query params -----------------------------
        // ?cols=&rows=&plants=[{x,y,w,h,form,color,name}]  (all optional)
        const q = new URLSearchParams(location.search);
        let cols = Math.max(1, Math.min(12, parseInt(q.get("cols") || "", 10) || 0));
        let rows = Math.max(1, Math.min(12, parseInt(q.get("rows") || "", 10) || 0));
        let plants = [];
        try {
          const raw = q.get("plants");
          if (raw) plants = JSON.parse(raw);
        } catch (e) {
          plants = [];
        }

        const personalized = plants.length > 0 && cols && rows;
        if (!personalized) {
          // Fallback demo garden so the standalone asset always looks intentional.
          cols = 4;
          rows = 3;
          const demoForms = ["leafy", "vine", "root", "root"];
          const demoColors = ["#7bc47f", "#3f8f57", "#e6a817", "#d1495b"];
          const demoNames = ["Lettuce", "Bush beans", "Carrots", "Radish"];
          plants = [];
          for (let y = 0; y < rows; y++)
            for (let x = 0; x < cols; x++)
              plants.push({
                x, y, w: 1, h: 1,
                form: demoForms[x % 4],
                color: demoColors[x % 4],
                name: demoNames[x % 4],
              });
        }
        document.getElementById("badge-text").textContent = personalized
          ? "Sprout · your garden"
          : "Sprout · demo garden";

        // ---- Renderer / scene ---------------------------------------------
        const canvas = document.getElementById("stage");
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;

        const scene = new THREE.Scene();
        scene.background = makeSkyTexture();
        scene.fog = new THREE.Fog(0xcdeecb, 40, 120);

        const camera = new THREE.PerspectiveCamera(
          50, window.innerWidth / window.innerHeight, 0.1, 300
        );

        scene.add(new THREE.HemisphereLight(0xbfe0ff, 0x3f6b34, 0.55));
        const sun = new THREE.DirectionalLight(0xfff1cf, 1.05);
        sun.position.set(9, 14, 7);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 80;
        sun.shadow.camera.left = -30;
        sun.shadow.camera.right = 30;
        sun.shadow.camera.top = 30;
        sun.shadow.camera.bottom = -30;
        scene.add(sun);

        const sunDisc = new THREE.Mesh(
          new THREE.SphereGeometry(1.4, 24, 24),
          new THREE.MeshBasicMaterial({ color: srgb(0xfff1b8) })
        );
        sunDisc.position.copy(sun.position).multiplyScalar(1.6);
        scene.add(sunDisc);

        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(120, 64),
          mat(0x5f9e4f, 1)
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ---- Build the raised bed to match the garden grid -----------------
        const CELL = 1.5;
        const bedH = 0.7;
        const soilTopY = bedH;
        const bedW = cols * CELL;
        const bedD = rows * CELL;
        const garden = new THREE.Group();
        scene.add(garden);
        buildRaisedBed(garden, bedW, bedD, bedH);

        // Place one plant per entry, mapped from grid cell (x=col, y=row).
        const swayables = [];
        for (const p of plants) {
          const w = Math.max(1, p.w || 1);
          const h = Math.max(1, p.h || 1);
          const cx = -bedW / 2 + (p.x + w / 2) * CELL;
          const cz = -bedD / 2 + (p.y + h / 2) * CELL;
          const cells = Math.max(w, h);
          const plant = makePlant(p.form, p.color, cells);
          plant.position.set(cx, soilTopY, cz);
          plant.rotation.y = Math.random() * Math.PI * 2;
          plant.userData.swayPhase = Math.random() * Math.PI * 2;
          garden.add(plant);
          plant.traverse((o) => {
            if (o.isMesh && o.userData.foliage) swayables.push(o);
          });
        }

        buildLegend(plants);

        // ---- Orbit controls -----------------------------------------------
        const target = new THREE.Vector3(0, 0.5, 0);
        const span = Math.max(bedW, bedD);
        let radius = span * 1.15 + 4.5;
        const minR = span * 0.5 + 2;
        const maxR = span * 3 + 12;
        let theta = Math.PI * 0.28;
        let phi = Math.PI * 0.34;
        const minPhi = 0.15, maxPhi = Math.PI / 2 - 0.05;
        let dragging = false;
        let autoRotate = true;
        let lastX = 0, lastY = 0;
        let idleTimer = null;

        function updateCamera() {
          const sp = Math.sin(phi);
          camera.position.set(
            target.x + radius * sp * Math.sin(theta),
            target.y + radius * Math.cos(phi),
            target.z + radius * sp * Math.cos(theta)
          );
          camera.lookAt(target);
        }

        const hint = document.getElementById("hint");
        setTimeout(() => hint.classList.add("show"), 600);
        setTimeout(() => hint.classList.remove("show"), 5200);

        function pauseAuto() {
          autoRotate = false;
          if (idleTimer) clearTimeout(idleTimer);
          idleTimer = setTimeout(() => (autoRotate = true), 4000);
        }
        canvas.addEventListener("pointerdown", (e) => {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          canvas.setPointerCapture(e.pointerId);
          pauseAuto();
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          theta -= (e.clientX - lastX) * 0.006;
          phi = Math.min(maxPhi, Math.max(minPhi, phi - (e.clientY - lastY) * 0.006));
          lastX = e.clientX;
          lastY = e.clientY;
        });
        const endDrag = () => (dragging = false);
        canvas.addEventListener("pointerup", endDrag);
        canvas.addEventListener("pointercancel", endDrag);
        canvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            radius = Math.min(maxR, Math.max(minR, radius + e.deltaY * 0.012));
            pauseAuto();
          },
          { passive: false }
        );

        function resize() {
          const w = window.innerWidth, h = window.innerHeight;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
        window.addEventListener("resize", resize);
        resize();

        const clock = new THREE.Clock();
        (function animate() {
          const t = clock.getElapsedTime();
          if (autoRotate && !dragging) theta += 0.0016;
          for (const o of swayables) {
            o.rotation.z = Math.sin(t * 1.3 + o.userData.swayPhase) * 0.03;
          }
          updateCamera();
          renderer.render(scene, camera);
          requestAnimationFrame(animate);
        })();

        // ================= helpers =================
        function makeSkyTexture() {
          const c = document.createElement("canvas");
          c.width = 4;
          c.height = 256;
          const ctx = c.getContext("2d");
          const g = ctx.createLinearGradient(0, 0, 0, 256);
          g.addColorStop(0, "#8ec9ff");
          g.addColorStop(0.55, "#bfe6ff");
          g.addColorStop(1, "#e7f6ea");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, 4, 256);
          const tex = new THREE.CanvasTexture(c);
          tex.magFilter = THREE.LinearFilter;
          tex.encoding = THREE.sRGBEncoding;
          return tex;
        }

        // Treat authored hex colors as sRGB so the sRGB output pass doesn't wash
        // them out (the classic three r128 "pale colors" pipeline gotcha).
        function srgb(hex) {
          return new THREE.Color(hex).convertSRGBToLinear();
        }
        function mat(color, rough) {
          return new THREE.MeshStandardMaterial({
            color: srgb(color),
            roughness: rough == null ? 0.7 : rough,
          });
        }
        function matColor(colorObj, rough) {
          return new THREE.MeshStandardMaterial({
            color: colorObj.clone().convertSRGBToLinear(),
            roughness: rough == null ? 0.7 : rough,
          });
        }
        // Mix two sRGB hex colors (t=0 → a, t=1 → b). Returns a THREE.Color (sRGB).
        function mix(aHex, bHex, t) {
          const a = new THREE.Color(aHex);
          const b = new THREE.Color(bHex);
          return a.lerp(b, t);
        }

        function buildRaisedBed(parent, w, d, h) {
          const wood = mat(0x9c6b3f, 0.85);
          const plankT = 0.28;
          const soil = new THREE.Mesh(
            new THREE.BoxGeometry(w - plankT, h * 0.9, d - plankT),
            mat(0x4a3120, 1)
          );
          soil.position.y = (h * 0.9) / 2 + 0.02;
          soil.receiveShadow = true;
          parent.add(soil);
          const sides = [
            [w, h, plankT, 0, h / 2, d / 2 - plankT / 2],
            [w, h, plankT, 0, h / 2, -d / 2 + plankT / 2],
            [plankT, h, d, w / 2 - plankT / 2, h / 2, 0],
            [plankT, h, d, -w / 2 + plankT / 2, h / 2, 0],
          ];
          for (const [sw, sh, sd, px, py, pz] of sides) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(sw, sh, sd), wood);
            m.position.set(px, py, pz);
            m.castShadow = true;
            m.receiveShadow = true;
            parent.add(m);
          }
        }

        // A colored disc under the plant that matches the plan's legend color,
        // tying the 3D bed back to the 2D grid.
        function marker(group, colorHex) {
          const disc = new THREE.Mesh(
            new THREE.CylinderGeometry(0.16, 0.16, 0.025, 16),
            matColor(new THREE.Color(colorHex), 0.85)
          );
          disc.position.y = 0.014;
          disc.receiveShadow = true;
          group.add(disc);
        }

        function foliageMesh(geo, colorObj) {
          const m = new THREE.Mesh(geo, matColor(colorObj, 0.9));
          m.castShadow = true;
          m.userData.foliage = true;
          m.userData.swayPhase = Math.random() * Math.PI * 2;
          return m;
        }

        // form: "leafy" | "root" | "vine" | "fruiting"
        function makePlant(form, colorHex, cells) {
          const g = new THREE.Group();
          marker(g, colorHex);
          const scale = 1.15 + 0.3 * (cells - 1);

          if (form === "vine") {
            const leaf = mix(0x3f8f57, colorHex, 0.32);
            const pole = new THREE.Mesh(
              new THREE.CylinderGeometry(0.04, 0.055, 1.5, 8),
              mat(0xcaa46a, 0.9)
            );
            pole.position.y = 0.75;
            pole.castShadow = true;
            g.add(pole);
            for (let i = 0; i < 12; i++) {
              const s = foliageMesh(
                new THREE.SphereGeometry(0.2 + Math.random() * 0.07, 10, 8),
                leaf
              );
              const a = i * 1.8;
              s.position.set(Math.cos(a) * 0.22, 0.3 + i * 0.11, Math.sin(a) * 0.22);
              g.add(s);
            }
          } else if (form === "root") {
            const frondColor = mix(0x4faa5a, colorHex, 0.26);
            for (let i = 0; i < 11; i++) {
              const blade = foliageMesh(new THREE.ConeGeometry(0.06, 0.85, 6), frondColor);
              const a = (i / 11) * Math.PI * 2;
              blade.position.set(Math.cos(a) * 0.09, 0.46, Math.sin(a) * 0.09);
              blade.rotation.z = Math.cos(a) * 0.28;
              blade.rotation.x = Math.sin(a) * 0.28;
              g.add(blade);
            }
            const bulb = new THREE.Mesh(
              new THREE.SphereGeometry(0.19, 14, 12),
              matColor(new THREE.Color(colorHex), 0.55)
            );
            bulb.position.y = 0.08;
            bulb.scale.set(1, 0.9, 1);
            bulb.castShadow = true;
            g.add(bulb);
          } else if (form === "fruiting") {
            const leaf = mix(0x4f9d57, colorHex, 0.28);
            for (let i = 0; i < 11; i++) {
              const s = foliageMesh(
                new THREE.SphereGeometry(0.22 + Math.random() * 0.06, 10, 8),
                leaf
              );
              const a = i * 1.5;
              const y = 0.35 + (i % 3) * 0.28;
              s.position.set(Math.cos(a) * 0.26, y, Math.sin(a) * 0.26);
              g.add(s);
            }
            for (let i = 0; i < 5; i++) {
              const fruit = new THREE.Mesh(
                new THREE.SphereGeometry(0.11, 10, 8),
                matColor(new THREE.Color(colorHex), 0.45)
              );
              const a = i * 1.9 + 0.5;
              fruit.position.set(Math.cos(a) * 0.3, 0.4 + (i % 2) * 0.25, Math.sin(a) * 0.3);
              fruit.castShadow = true;
              g.add(fruit);
            }
          } else {
            // leafy — a leafy head/rosette
            const leaf = mix(0x6fbf6a, colorHex, 0.34);
            for (let i = 0; i < 9; i++) {
              const s = foliageMesh(new THREE.SphereGeometry(0.26, 12, 10), leaf);
              const a = (i / 9) * Math.PI * 2;
              s.position.set(Math.cos(a) * 0.26, 0.3, Math.sin(a) * 0.26);
              s.scale.set(1, 0.9, 1);
              g.add(s);
            }
            const core = foliageMesh(
              new THREE.SphereGeometry(0.3, 14, 12),
              mix(0x8ecb6f, colorHex, 0.34)
            );
            core.position.y = 0.42;
            g.add(core);
          }

          g.scale.setScalar(scale);
          return g;
        }

        function buildLegend(list) {
          const seen = new Map();
          for (const p of list) if (p.name && !seen.has(p.name)) seen.set(p.name, p.color);
          const el = document.getElementById("legend");
          el.innerHTML = "";
          for (const [name, color] of seen) {
            const row = document.createElement("div");
            row.className = "row";
            const sw = document.createElement("span");
            sw.className = "sw";
            sw.style.background = color;
            const label = document.createElement("span");
            label.textContent = name;
            row.appendChild(sw);
            row.appendChild(label);
            el.appendChild(row);
          }
        }
      })();
    </script>
  </body>
</html>
